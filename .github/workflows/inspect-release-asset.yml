name: Inspect release asset

on:
  push:
    branches:
      - 'arena/**'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  inspect:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Download release asset
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          mkdir -p /tmp/rel
          gh release download Src --repo demoneditz985-ctrl/NewSrc --dir /tmp/rel --clobber
          ls -la /tmp/rel

      - name: Extract
        run: |
          rm -rf /tmp/out && mkdir -p /tmp/out
          cd /tmp/out
          if ! unzip -o -q /tmp/rel/NIKUMODS.WINDOWS.XP.GUI.zip 2>/dev/null; then
            sudo apt-get update -qq >/dev/null 2>&1 || true
            sudo apt-get install -y -qq p7zip-full >/dev/null 2>&1 || true
            7z x -y -o/tmp/out /tmp/rel/NIKUMODS.WINDOWS.XP.GUI.zip >/dev/null || echo "EXTRACT FAILED"
          fi
          du -sh /tmp/out

      - name: Full file listing
        run: |
          mkdir -p "$GITHUB_WORKSPACE/_asset"
          find /tmp/out -type f -printf '%10s  %P\n' | sed 's|^|  |' | sort -k2 > "$GITHUB_WORKSPACE/_asset/all-files.txt"
          wc -l "$GITHUB_WORKSPACE/_asset/all-files.txt"

      - name: Copy source-only subset
        run: |
          SRC="/tmp/out/NIKUMODS WINDOWS XP GUI"
          DST=/tmp/keep
          rm -rf "$DST" && mkdir -p "$DST"
          cd "$SRC"
          # project files, minus vendored binaries / huge font blobs
          find . -type f \
            ! -path '*/curl/*' \
            ! -path '*/openssl-*/*' \
            ! -path '*/ur_nikuu/*' \
            ! -path '*/Hacks/Tools/*' \
            ! -path '*/build/*' \
            ! -path '*/.gradle/*' \
            ! -name '*.a' ! -name '*.so' ! -name '*.o' ! -name '*.zip' \
            ! -name '*.DS_Store' ! -name '*.rartemp*' ! -name '*.bak' \
            -size -3M -print0 > /tmp/keep_list
          echo "files kept: $(tr -dc '\0' < /tmp/keep_list | wc -c)"
          tar -cf - --null -T /tmp/keep_list | tar -xf - -C "$DST"
          echo "=== kept size ==="
          du -sh "$DST"
          echo "=== top 30 kept files ==="
          find "$DST" -type f -printf '%12s  %P\n' | sort -rn | head -30
          echo "=== excluded (big) files ==="
          cd "$SRC"
          find . -type f \( -size +3M -o -name '*.a' -o -name '*.so' \) -printf '%12s  %P\n' | sort -rn | head -30

      - name: Commit and push
        run: |
          cd "$GITHUB_WORKSPACE"
          git config user.name "Arena Agent"
          git config user.email "agent@arena.ai"
          rm -rf ShadowModz
          mkdir -p ShadowModz
          cp -a /tmp/keep/. ShadowModz/
          git pull --rebase origin "${GITHUB_REF_NAME}" 2>/dev/null || true
          git add _asset ShadowModz
          if git diff --cached --quiet; then
            echo "nothing to commit"
          else
            git commit -m "chore: import release source subset for rebrand [skip ci]"
            git push origin "HEAD:${GITHUB_REF_NAME}"
          fi
          echo "=== committed size ==="
          du -sh ShadowModz || true
