name: Inspect release asset

on:
  push:
    branches:
      - 'arena/**'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  inspect:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Fetch missing font assets into _asset/raw
        run: |
          {
            set -x
            echo "workspace=$GITHUB_WORKSPACE"
            mkdir -p /tmp/rel
            gh release download Src --repo demoneditz985-ctrl/NewSrc --dir /tmp/rel --clobber
            ls -la /tmp/rel

            rm -rf /tmp/out && mkdir -p /tmp/out
            cd /tmp/out
            unzip -o -q /tmp/rel/NIKUMODS.WINDOWS.XP.GUI.zip || echo "UNZIP FAILED"
            SRC="/tmp/out/NIKUMODS WINDOWS XP GUI/app/src/main/jni"
            ls -la "$SRC/NikuMods/Win95Assets/" || echo "NO ASSET DIR"

            RAW="$GITHUB_WORKSPACE/_asset/raw"
            mkdir -p "$RAW/NikuMods/Win95Assets"
            for f in "NikuMods/Win95Assets/MicrosFont.hpp"; do
              if [ -f "$SRC/$f" ]; then
                cp -f "$SRC/$f" "$RAW/$f" && echo "COPY OK $(stat -c%s "$RAW/$f")"
              else
                echo "SOURCE MISSING: $f"
              fi
            done
            echo "=== raw tree ==="
            find "$RAW" -type f -printf '%12s  %P\n'
          } > "$GITHUB_WORKSPACE/_asset/debug.txt" 2>&1
          echo "debug written"
        continue-on-error: true

      - name: Commit and push
        run: |
          cd "$GITHUB_WORKSPACE"
          git config user.name "Arena Agent"
          git config user.email "agent@arena.ai"
          git pull --rebase origin "${GITHUB_REF_NAME}" 2>/dev/null || true
          git add -A
          if git diff --cached --quiet; then
            echo "nothing to commit"
          else
            git commit -m "chore: fetch missing font assets (raw) [skip ci]"
            git push origin "HEAD:${GITHUB_REF_NAME}"
          fi
