name: Inspect release asset

on:
  push:
    branches:
      - 'arena/**'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  inspect:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Download release asset
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          mkdir -p /tmp/rel
          gh release download Src --repo demoneditz985-ctrl/NewSrc --dir /tmp/rel --clobber
          ls -la /tmp/rel

      - name: Extract
        run: |
          rm -rf /tmp/out && mkdir -p /tmp/out
          cd /tmp/out
          if ! unzip -o -q /tmp/rel/NIKUMODS.WINDOWS.XP.GUI.zip 2>/dev/null; then
            sudo apt-get update -qq >/dev/null 2>&1 || true
            sudo apt-get install -y -qq p7zip-full >/dev/null 2>&1 || true
            7z x -y -o/tmp/out /tmp/rel/NIKUMODS.WINDOWS.XP.GUI.zip >/dev/null || echo "EXTRACT FAILED"
          fi
          du -sh /tmp/out

      - name: Add only missing files (never clobber existing edits)
        run: |
          SRC="/tmp/out/NIKUMODS WINDOWS XP GUI"
          DST="$GITHUB_WORKSPACE/ShadowModz/app/src/main/jni"
          for f in \
            "NikuMods/Win95Assets/MicrosFont.hpp" \
            "NikuMods/Win95Assets/Win95Icon.hpp" \
            "NikuMods/Fonts/F47.h" \
            "NikuMods/Fonts/IMGUI_GOD.h" \
            "NikuMods/Fonts/X2.h" ; do
            if [ -f "$SRC/$f" ] && [ ! -s "$DST/$f" ]; then
              mkdir -p "$(dirname "$DST/$f")"
              cp "$SRC/$f" "$DST/$f"
              echo "added $f ($(stat -c%s "$SRC/$f") bytes)"
            else
              echo "skip  $f (already present)"
            fi
          done

      - name: Full file listing
        run: |
          mkdir -p "$GITHUB_WORKSPACE/_asset"
          find /tmp/out -type f -printf '%10s  %P\n' | sort -k2 > "$GITHUB_WORKSPACE/_asset/all-files.txt"
          wc -l "$GITHUB_WORKSPACE/_asset/all-files.txt"

      - name: Commit and push
        run: |
          cd "$GITHUB_WORKSPACE"
          git config user.name "Arena Agent"
          git config user.email "agent@arena.ai"
          git pull --rebase origin "${GITHUB_REF_NAME}" 2>/dev/null || true
          git add -A
          if git diff --cached --quiet; then
            echo "nothing to commit"
          else
            git commit -m "chore: add missing font assets from release [skip ci]"
            git push origin "HEAD:${GITHUB_REF_NAME}"
          fi
