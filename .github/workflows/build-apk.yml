name: Build APK

on:
  push:
    branches:
      - 'arena/**'
  workflow_dispatch:

permissions:
  contents: write
  issues: write

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 11
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '11'

      - name: Install Gradle 7.6.4
        run: |
          curl -sSL -o /tmp/gradle.zip https://services.gradle.org/distributions/gradle-7.6.4-bin.zip
          sudo unzip -q /tmp/gradle.zip -d /opt
          sudo ln -sf /opt/gradle-7.6.4/bin/gradle /usr/local/bin/gradle
          gradle --version | head -6

      - name: Android SDK info + licences
        run: |
          echo "ANDROID_HOME=$ANDROID_HOME  ANDROID_SDK_ROOT=$ANDROID_SDK_ROOT"
          ls "$ANDROID_HOME" || true
          ls "$ANDROID_HOME/ndk" || true
          if [ -x "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" ]; then
            yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --licenses >/dev/null 2>&1 || true
          fi

      - name: Download upstream release (vendored prebuilts)
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          mkdir -p /tmp/rel
          gh release download Src --repo demoneditz985-ctrl/NewSrc --dir /tmp/rel --clobber
          rm -rf /tmp/upstream && mkdir -p /tmp/upstream
          unzip -q /tmp/rel/NIKUMODS.WINDOWS.XP.GUI.zip -d /tmp/upstream
          ls "/tmp/upstream/NIKUMODS WINDOWS XP GUI"

      - name: Assemble build tree
        run: |
          set -e
          SRC="/tmp/upstream/NIKUMODS WINDOWS XP GUI"
          rm -rf /tmp/build && mkdir -p /tmp/build
          # full upstream tree: keeps Dobby/curl/openssl .a prebuilts and headers
          cp -a "$SRC/." /tmp/build/
          # overlay the rebranded SHADOW MODZ sources from this repo
          cp -a ShadowModz/app/src/main/jni/NikuMods/. /tmp/build/app/src/main/jni/NikuMods/
          cp    ShadowModz/app/src/main/jni/Main.cpp   /tmp/build/app/src/main/jni/Main.cpp
          cp -a ShadowModz/app/src/main/jni/Struct/.   /tmp/build/app/src/main/jni/Struct/
          # linker shim for the legacy __sync_add_and_fetch_4 call in the 32-bit OpenSSL prebuilt
          cp    ShadowModz/app/src/main/jni/sync_shim.c /tmp/build/app/src/main/jni/sync_shim.c
          rm -rf /tmp/build/app/src/main/res
          cp -a ShadowModz/app/src/main/res /tmp/build/app/src/main/res
          rm -rf /tmp/build/app/src/main/java
          cp -a ShadowModz/app/src/main/java /tmp/build/app/src/main/java
          cp    ShadowModz/app/src/main/AndroidManifest.xml /tmp/build/app/src/main/AndroidManifest.xml
          cp    ShadowModz/app/build.gradle                 /tmp/build/app/build.gradle
          cp    ShadowModz/settings.gradle /tmp/build/settings.gradle
          cp    ShadowModz/build.gradle     /tmp/build/build.gradle

          # Repair the case-only #include mismatches this tree carries from a
          # case-insensitive filesystem (dobby/Dobby, Il2cpp/Il2Cpp, ...).
          python3 ci/fix-include-case.py /tmp/build/app/src/main/jni | tail -40

          # Case-sensitivity shim: this tree was authored on a case-insensitive
          # filesystem, so ur_nikuu/IL2CppSDKGenerator/Il2Cpp.cpp does
          # #include "Il2cpp.h" while the header on disk is Unity/Il2Cpp.h.
          # Drop a correctly-cased copy where the include path can see it.
          JNI=/tmp/build/app/src/main/jni
          cp -n "$JNI/NikuModsStuff/Unity/Il2Cpp.h" "$JNI/NikuModsStuff/Il2cpp.h"
          ls -la "$JNI/NikuModsStuff/" | grep -i il2cpp

          echo "=== overlay done ==="
          ls /tmp/build

      - name: Build
        id: gradle
        run: |
          cd /tmp/build
          gradle assembleDebug --no-daemon --stacktrace > /tmp/build.log 2>&1
          echo "gradle_exit=$?"
          tail -120 /tmp/build.log

      - name: Collect build log and artifacts
        if: always()
        run: |
          mkdir -p "$GITHUB_WORKSPACE/ci-out"
          cp /tmp/build.log "$GITHUB_WORKSPACE/ci-out/build.log" 2>/dev/null || echo "no build log"
          mkdir -p "$GITHUB_WORKSPACE/apk"
          find /tmp/build -type f -name '*.apk' -exec cp {} "$GITHUB_WORKSPACE/apk/" \; 2>/dev/null || true
          # the deliverable keeps a stable name; drop the raw gradle copy
          if [ -f "$GITHUB_WORKSPACE/apk/app-debug.apk" ]; then
            mv -f "$GITHUB_WORKSPACE/apk/app-debug.apk" "$GITHUB_WORKSPACE/apk/ShadowModz-v4.0.apk"
          fi
          # keep the compiled native module too - that is the payload a loader injects
          mkdir -p "$GITHUB_WORKSPACE/native"
          find /tmp/build -type f -name 'libNikuMods.so' -exec sh -c 'abi=$(basename $(dirname {})); cp {} "$1/native/$abi-libNikuMods.so"' _ "$GITHUB_WORKSPACE" \; 2>/dev/null || true
          ls -la "$GITHUB_WORKSPACE/apk" "$GITHUB_WORKSPACE/native" 2>&1 | head -30

      - name: Commit artifacts
        if: always()
        id: commit
        run: |
          cd "$GITHUB_WORKSPACE"
          git config user.name "Arena Agent"
          git config user.email "agent@arena.ai"
          git pull --rebase origin "${GITHUB_REF_NAME}" || echo "PULL FAILED"
          git add -A || echo "ADD FAILED"
          if git diff --cached --quiet; then
            echo "COMMIT RESULT: nothing to commit"
          else
            git commit -m "ci: APK build output [skip ci]" || echo "COMMIT FAILED"
            git push origin "HEAD:${GITHUB_REF_NAME}" || echo "PUSH FAILED"
          fi
          echo "--- git status ---"
          git status --short | head -20

      - name: Upload APK artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ShadowModz-v4.0
          path: apk/*.apk
          if-no-files-found: ignore

      - name: Publish diagnostics (readable from the API)
        if: always()
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          {
            echo "run: $GITHUB_RUN_ID  commit: $GITHUB_SHA"
            echo
            echo "===== build.log : head 120 ====="
            head -120 /tmp/build.log 2>&1
            echo
            echo "===== build.log : tail 260 ====="
            tail -260 /tmp/build.log 2>&1
            echo
            echo "===== build tree ====="
            ls -la /tmp/build 2>&1 | head -30
            echo
            echo "===== apk / so found ====="
            find /tmp/build -type f \( -name '*.apk' -o -name '*.so' \) 2>/dev/null | head -20
            echo
            echo "===== gradle home / sdk ====="
            echo "ANDROID_HOME=$ANDROID_HOME"
            ls "$ANDROID_HOME" 2>&1 | head -20
            ls "$ANDROID_HOME/ndk" 2>&1 | head -10
            echo
            echo "===== jdk ====="
            java -version 2>&1 | head -3
          } > /tmp/diag.txt 2>&1
          url=$(gh issue create --repo demoneditz985-ctrl/NewSrc \
                  --title "CI build log $GITHUB_RUN_ID" \
                  --body-file /tmp/diag.txt 2>&1) || url="ISSUE CREATE FAILED: $url"
          echo "diagnostics: $url"
          # keep the run green so the artifact commit above is the only signal
          true
